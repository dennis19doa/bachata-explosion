    <text x="260" y="218" font-size="62" letter-spacing="7">BERLIN</text>
    <text x="260" y="315" font-size="132" letter-spacing="2">030</text>
    <text x="260" y="365" font-size="25" letter-spacing="8">BACHATA EXPLOSION</text>
