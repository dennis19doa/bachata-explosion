name: Quality checks

on:
  push:
    branches: [modernize-cloudflare-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Audit generated site
        run: pnpm check:site

      - name: Audit WordPress content parity when private export is available
        run: |
          if [ -f migration/wp-pages-public-export.json ]; then
            pnpm check:content
          else
            echo "Skipping WordPress parity audit: private migration export is intentionally not committed to GitHub."
          fi
