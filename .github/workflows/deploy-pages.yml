name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages preview
        env:
          PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.PUBLIC_CONTACT_FORM_ENDPOINT }}
          PUBLIC_VOLUNTEER_FORM_ENDPOINT: ${{ vars.PUBLIC_VOLUNTEER_FORM_ENDPOINT }}
          PUBLIC_AMBASSADOR_FORM_ENDPOINT: ${{ vars.PUBLIC_AMBASSADOR_FORM_ENDPOINT }}
          PUBLIC_JJ_FORM_ENDPOINT: ${{ vars.PUBLIC_JJ_FORM_ENDPOINT }}
          PUBLIC_NEWSLETTER_FORM_ENDPOINT: ${{ vars.PUBLIC_NEWSLETTER_FORM_ENDPOINT }}
        run: pnpm build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
